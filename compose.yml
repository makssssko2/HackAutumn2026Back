name: invoice-keeper
services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoice_keeper
      POSTGRES_USER: invoice_keeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_keeper"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://invoice_keeper:${POSTGRES_PASSWORD:-local-development-only}@db:5432/invoice_keeper
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - attachments:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://invoice_keeper:${POSTGRES_PASSWORD:-local-development-only}@db:5432/invoice_keeper
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
  bitrix-events:
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://invoice_keeper:${POSTGRES_PASSWORD:-local-development-only}@db:5432/invoice_keeper
    command: ["python", "-m", "app.bitrix24_runner"]
    depends_on:
      api:
        condition: service_healthy
  bot:
    restart: unless-stopped
    build: .
    profiles: ["telegram"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://invoice_keeper:${POSTGRES_PASSWORD:-local-development-only}@db:5432/invoice_keeper
    command: ["python", "-m", "app.telegram_bot"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  attachments:
